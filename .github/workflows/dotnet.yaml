name: dotnet-check

on:
  workflow_dispatch:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "ui/package-lock.json"

      - name: Build UI bundle
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Setup DotNet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore dependencies
        run: dotnet restore "SharpPersistence.slnx" --locked-mode

      - name: Build
        run: dotnet build "SharpPersistence.slnx" --configuration Release --no-restore

      - name: Run tests
        run: dotnet test "SharpPersistence.slnx" --configuration Release --no-build --no-restore --verbosity normal
